<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061d18">
<meta name="description" content="Yasser Nader Photography — Wedding Packages">
<title>Yasser Nader Photography | Wedding Packages</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">YN</span><span>YASSER NADER <small>PHOTOGRAPHY</small></span></div>
    <div class="tools">
      <button id="zoomOut" aria-label="تصغير">−</button>
      <button id="zoomIn" aria-label="تكبير">+</button>
      <button id="fullscreen" aria-label="ملء الشاشة">⛶</button>
    </div>
  </header>

  <section class="viewer" id="viewer" aria-label="كتالوج باكدجات الزفاف">
    <div class="book" id="book">
      <div class="page-under" id="pageUnder"></div>
      <div class="page-current" id="pageCurrent"></div>
      <div class="page-next" id="pageNext"></div>
      <div class="edge-hit edge-right" id="edgeRight" aria-hidden="true"></div>
      <div class="edge-hit edge-left" id="edgeLeft" aria-hidden="true"></div>
    </div>
    <button class="nav prev" id="prev" aria-label="الصفحة السابقة">‹</button>
    <button class="nav next" id="next" aria-label="الصفحة التالية">›</button>
    <div class="hint" id="hint">اسحب الصفحة من الحافة للتقليب</div>
  </section>

  <footer class="bottombar">
    <span id="counter">1 / 6</span>
    <div class="dots" id="dots" aria-label="اختيار الصفحة"></div>
    <span class="tip">← → للتقليب</span>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
